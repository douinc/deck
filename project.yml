name: Deck

options:
  bundleIdPrefix: com.dou
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  # ─────────────────────────────────────────────────────────────
  # Mac Menu Bar App
  # ─────────────────────────────────────────────────────────────
  DeckMac:
    type: application
    platform: macOS
    sources:
      - path: MacApp
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleName: Deck
        CFBundleShortVersionString: "1.11"
        LSUIElement: true
        NSBonjourServices:
          - _clickerremote._tcp
          - _clickerremote._udp
        NSLocalNetworkUsageDescription: "Deck needs local network access to connect with your iPhone for presentation control."
        NSAppleEventsUsageDescription: "Deck needs to send keystrokes to control your presentation software."
    entitlements:
      path: MacApp/DeckMac.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dou.clicker-mac
        PRODUCT_NAME: Deck
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.11"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MacApp/DeckMac.entitlements
        DEVELOPMENT_TEAM: HD35YQ72U4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Required for notarization
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

  # ─────────────────────────────────────────────────────────────
  # iPhone App
  # ─────────────────────────────────────────────────────────────
  DeckiOS:
    type: application
    platform: iOS
    sources:
      - path: iPhoneApp
        excludes:
          - "*.plist"
          - "*.storekit"
      - path: iPhoneApp/Deck.storekit
        buildPhase: none
      - path: Shared
    capabilities:
      In-App Purchase: {}
    info:
      path: iPhoneApp/Info.plist
      properties:
        CFBundleName: Deck
        CFBundleShortVersionString: "1.11"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBonjourServices:
          - _clickerremote._tcp
          - _clickerremote._udp
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: "Deck needs local network access to find and connect to your Mac."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dou.clicker-ios
        PRODUCT_NAME: Deck
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        MARKETING_VERSION: "1.11"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HD35YQ72U4
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DeckWatch
        embed: true
      - target: DeckLiveActivity
        embed: true

  # ─────────────────────────────────────────────────────────────
  # Live Activity Widget Extension
  # ─────────────────────────────────────────────────────────────
  DeckLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivityWidget
      - path: iPhoneApp/PresentationAttributes.swift
    info:
      path: LiveActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Deck
        CFBundleShortVersionString: "1.11"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dou.clicker-ios.LiveActivity
        PRODUCT_NAME: DeckLiveActivity
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        MARKETING_VERSION: "1.11"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HD35YQ72U4
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"

  # ─────────────────────────────────────────────────────────────
  # Apple Watch App
  # ─────────────────────────────────────────────────────────────
  DeckWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes:
          - "*.plist"
      - path: Shared
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleName: Deck
        CFBundleShortVersionString: "1.11"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dou.clicker-ios
        WKBackgroundModes:
          - self-care
        NSMotionUsageDescription: "Deck uses motion sensors to detect wrist gestures for hands-free slide control during presentations."
    entitlements:
      path: WatchApp/DeckWatch.entitlements
      properties: {}
    dependencies:
      - sdk: CoreMotion.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dou.clicker-ios.watchkitapp
        PRODUCT_NAME: DeckWatch
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        MARKETING_VERSION: "1.11"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HD35YQ72U4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"  # Watch only

schemes:
  DeckMac:
    build:
      targets:
        DeckMac: all
    run:
      config: Debug
    archive:
      config: Release

  DeckiOS:
    build:
      targets:
        DeckiOS: all
        DeckWatch: all
        DeckLiveActivity: all
    run:
      config: Debug
      executable: DeckiOS
      storeKitConfiguration: iPhoneApp/Deck.storekit
    archive:
      config: Release

  DeckWatch:
    build:
      targets:
        DeckWatch: all
    run:
      config: Debug
    archive:
      config: Release
