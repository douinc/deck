    (() => {
      const tl = gsap.timeline({ paused: true });

      // ---- Framings: screen origin in frame px + scale (UI is authored at 2 px per point) ----
      const HOME = { x: 1370, y: 59, scale: 0.55 };     // whole phone
      const CLOSE = { x: 1187, y: -259, scale: 0.85 };  // readout down to the Previous button
      const READ = { x: 1180, y: -180, scale: 1.25 };   // punch-in on the timer readout
      const WATCH = { x: 1362, y: 267, scale: 1.1 };
      const HUB = "1591px 540px";                       // the point devices morph around

      gsap.set("#rm-phone-cam", { transformOrigin: "0 0", ...CLOSE });
      gsap.set("#rm-watch-cam", { transformOrigin: "0 0", ...WATCH });
      gsap.set("#rm-phone-fx", { transformOrigin: HUB });
      gsap.set("#rm-watch-fx", { transformOrigin: HUB, opacity: 0 });
      gsap.set("#rm-phone-tilt", { transformOrigin: "402px 1136.38px" });
      gsap.set("#rm-watch-tilt", { transformOrigin: "208px 248px" });
      gsap.set(["#rm-cap-pointer", "#rm-pointer-on", "#rm-w-fl", "#rm-w-fl-prev-hand", "#rm-w-fl-next-hand"], { opacity: 0 });

      // ---- The timer counts the film's own runtime (PresentationTimer, no limit set) ----
      const LH = 181.78;
      for (let t = 1; t <= 27; t++) tl.to("#rm-ones", { y: -t * LH, duration: 0.25, ease: "power2.out" }, t);
      tl.to("#rm-tens", { y: -LH, duration: 0.25, ease: "power2.out" }, 10);
      tl.to("#rm-tens", { y: -2 * LH, duration: 0.25, ease: "power2.out" }, 20);
      // With no limit the arc sweeps once a minute: fraction = elapsed / 60
      tl.fromTo("#rm-head-rot", { rotation: 41.13 }, { rotation: 60.97, duration: 27, ease: "none" }, 0);
      tl.fromTo("#rm-bar", { strokeDashoffset: 1 }, { strokeDashoffset: 0.55, duration: 27, ease: "none" }, 0);
      tl.fromTo("#rm-bar-grad", { attr: { x2: 25.00, y2: 385.29 } }, { attr: { x2: 165.61, y2: 271.83 }, duration: 27, ease: "none" }, 0);
      for (let i = 1; i <= 30; i++) gsap.set("#rm-tick-" + i, { opacity: 0 });
      for (let i = 1; i <= 13; i++) tl.set("#rm-tick-" + i, { opacity: 1 }, i * 2);

      // ---- A press, as ArcPressStyle draws it: 0.92 scale and 0.75 opacity, eased out ----
      const press = (sel, t, down = 0.92) => {
        tl.to(sel, { scale: down, opacity: 0.75, duration: 0.12, ease: "power2.out" }, t - 0.12);
        tl.to(sel, { scale: 1, opacity: 1, duration: 0.18, ease: "power2.out" }, t);
      };

      // Hook and tension: three taps on Next
      press("#rm-next", 1.0);
      press("#rm-next", 3.0);
      tl.to("#rm-phone-cam", { ...HOME, duration: 0.6, ease: "power2.inOut" }, 3.0);
      press("#rm-next", 6.5);

      // 8.0  the phone becomes the Watch
      tl.to("#rm-phone-fx", { scale: 0.72, opacity: 0, filter: "blur(14px)", duration: 0.25, ease: "power3.in" }, 8.0);
      tl.fromTo("#rm-watch-fx", { scale: 1.35, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 8.15);

      // 9.0  Double Tap: the primary button fires twice
      press("#rm-w-dt-next", 8.78, 0.94);
      press("#rm-w-dt-next", 9.0, 0.94);

      // 11.0  Watch switches to the Wrist Flick layout
      tl.to("#rm-w-dt", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 10.9);
      tl.fromTo("#rm-w-fl", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, 11.06);

      // A flick: the wrist snaps, the button that fired lights yellow with the hand (GestureManager.lastGesture)
      const flick = (t, which, dir) => {
        tl.to("#rm-watch-tilt", { rotation: 14 * dir, duration: 0.14, ease: "power2.in" }, t - 0.14);
        tl.to("#rm-watch-tilt", { rotation: 0, duration: 0.42, ease: "elastic.out(1, 0.6)" }, t);
        tl.to("#rm-w-fl-" + which, { backgroundColor: "#4c4003", duration: 0.2, ease: "power2.out" }, t);
        tl.to("#rm-w-fl-" + which + "-hand", { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
        tl.to("#rm-w-fl-" + which, { backgroundColor: "#002b4c", duration: 0.5, ease: "power1.in" }, t + 0.55);
        tl.to("#rm-w-fl-" + which + "-hand", { opacity: 0, duration: 0.5, ease: "power1.in" }, t + 0.55);
      };
      flick(11.5, "next", -1);
      flick(12.9, "prev", 1);    // the footage flicks back here…
      flick(14.22, "next", -1);  // …and forward again here

      // 14.75  the Watch becomes the phone again, close on the arc
      tl.to("#rm-watch-fx", { scale: 0.8, opacity: 0, filter: "blur(14px)", duration: 0.25, ease: "power3.in" }, 14.75);
      tl.set("#rm-phone-cam", { ...CLOSE }, 14.8);
      tl.set("#rm-phone-fx", { scale: 1.25 }, 14.85);
      tl.to("#rm-phone-fx", { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 14.9);

      // 15.5  tap, then punch in on the readout
      press("#rm-next", 15.5);
      tl.to("#rm-phone-cam", { ...READ, duration: 0.6, ease: "power2.inOut" }, 15.6);
      tl.to("#rm-phone-cam", { ...CLOSE, duration: 0.55, ease: "power2.inOut" }, 17.3);
      press("#rm-next", 18.0);

      // 19.0-23.0  Pointer held (PointerButton + ArcRemoteView: others drop to 30%, caption changes)
      const others = ["#rm-prev", "#rm-next", "#rm-reset", "#rm-toggle", "#rm-settings"];
      tl.to("#rm-pointer", { scale: 1.15, duration: 0.15, ease: "power2.out" }, 19.0);
      tl.to("#rm-pointer-on", { opacity: 1, duration: 0.15, ease: "power2.out" }, 19.0);
      tl.to(others, { opacity: 0.3, duration: 0.15, ease: "power2.out" }, 19.0);
      tl.to("#rm-cap-elapsed", { opacity: 0, duration: 0.15 }, 19.0);
      tl.to("#rm-cap-pointer", { opacity: 1, duration: 0.15 }, 19.0);
      // aiming: the phone turns with the cursor
      tl.to("#rm-phone-tilt", { rotation: -2.2, duration: 0.9, ease: "sine.inOut" }, 19.25);
      tl.to("#rm-phone-tilt", { rotation: 1.6, duration: 1.0, ease: "sine.inOut" }, 20.15);
      tl.to("#rm-phone-tilt", { rotation: -1.4, duration: 0.9, ease: "sine.inOut" }, 21.15);
      tl.to("#rm-phone-tilt", { rotation: 0, duration: 0.7, ease: "sine.inOut" }, 22.05);
      tl.to("#rm-pointer", { scale: 1, duration: 0.15, ease: "power2.out" }, 23.0);
      tl.to("#rm-pointer-on", { opacity: 0, duration: 0.15, ease: "power2.out" }, 23.0);
      tl.to(others, { opacity: 1, duration: 0.15, ease: "power2.out" }, 23.0);
      tl.to("#rm-cap-elapsed", { opacity: 1, duration: 0.15 }, 23.0);
      tl.to("#rm-cap-pointer", { opacity: 0, duration: 0.15 }, 23.0);
      tl.to("#rm-phone-cam", { ...HOME, duration: 0.6, ease: "power2.inOut" }, 23.0);

      // 26.0  last tap: the Next button leaves for the end card, the phone slides away
      tl.to("#rm-next", { scale: 0.92, duration: 0.12, ease: "power2.out" }, 25.88);
      tl.set("#rm-next", { opacity: 0 }, 26.0);
      tl.to("#rm-phone-fx", { x: 760, duration: 0.45, ease: "power3.in" }, 26.05);

      window.__timelines["remote"] = tl;
    })();
  </script>
</template>
